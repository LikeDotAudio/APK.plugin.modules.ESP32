[package]
name = "apkaudio-plugin-modules-esp32"
version = "0.3.2"
edition = "2024"
# Standalone (plugin_standalone.py shape): no workspace key. The DISCOVERY.Engine
# workspace reaches it through SRC/members/DATA.ESP32.

[dependencies]
# The one OcaBin reader, shared by DATA.ESP32/NETWORK/NTP/PI; it lives here.
apkaudio-ocabin = { path = "ocabin" }

[build-dependencies]
apkaudio-ocabin = { path = "ocabin", default-features = false }
